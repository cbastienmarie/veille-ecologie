name: Publier la veille écologique
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer et vérifier le site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('data/articles.json')
          if not source.exists():
              source = Path('articles.json')
          articles = json.loads(source.read_text(encoding='utf-8'))
          if not isinstance(articles, list):
              raise SystemExit('La base doit être une liste JSON.')
          html = Path('index.html').read_text(encoding='utf-8')
          html = html.replace("fetch('data/articles.json')", "fetch('./articles.json')")
          html = html.replace("x.localeCompare(y,'fr')", "String(x).localeCompare(String(y),'fr')")
          site = Path('_site')
          site.mkdir(exist_ok=True)
          (site / 'index.html').write_text(html, encoding='utf-8')
          (site / 'articles.json').write_text(json.dumps(articles, ensure_ascii=False), encoding='utf-8')
          (site / '.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4

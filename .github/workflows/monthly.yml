name: Actualisation mensuelle de la veille
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: monthly-ecology
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les articles récents
        run: python scripts/monthly_update.py
      - name: Conserver le bilan même en cas d'échec
        if: always()
        run: |
          if [ -f reports/latest.json ]; then
            echo '### Bilan de collecte Crossref' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/latest.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enregistrer les données et le bilan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles.json reports/latest.json
          if [ -f data/articles.json ]; then git add data/articles.json; fi
          git diff --cached --quiet || git commit -m 'Actualisation mensuelle Crossref et bilan de couverture'
          git push origin HEAD:main
      - name: Déclencher explicitement la publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord — Veille écologie & biodiversité</title>
<style>
:root{--bg:#0f172a;--panel:#111c31;--panel2:#16233c;--txt:#e8eef8;--muted:#9fb0c8;--blue:#60a5fa}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:24px 28px;background:linear-gradient(120deg,#0b1220,#132441);border-bottom:1px solid #22314f}
h1{margin:0;font-size:22px}.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px;max-width:1500px;margin:auto}
.filters{background:var(--panel);border:1px solid #22314f;border-radius:14px;padding:16px;height:fit-content;position:sticky;top:12px}
.filters h3{margin:14px 0 8px;font-size:13px;text-transform:uppercase;color:var(--muted)}
select,input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid #2c3d5e;border-radius:9px;padding:9px}
label.chk{display:flex;gap:8px;font-size:13.5px;margin:5px 0}
button{background:#1d4ed8;color:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:600;width:100%;margin-top:14px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid #22314f;border-radius:14px;padding:14px}.kpi b{display:block;font-size:26px}.kpi span{color:var(--muted);font-size:12.5px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid #22314f;border-radius:14px;padding:16px}.card h2{font-size:15px;margin:0 0 10px}
canvas{width:100%;height:230px;display:block}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.article{background:var(--panel);border:1px solid #22314f;border-left:4px solid var(--blue);border-radius:12px;padding:14px}
.article h4{margin:0 0 6px;font-size:15px}.meta{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.resume{font-size:13.5px;line-height:1.5}.tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#1e2f4d}.tag.focus{background:#14532d;color:#bbf7d0}.tag.pressure{background:#4c1d95;color:#e9d5ff}
a{color:var(--blue);text-decoration:none;font-size:12.5px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.charts{grid-template-columns:1fr}.filters{position:static}}
</style></head><body>
<header><h1>Veille écologie & biodiversité</h1><p class="sub">Articles scientifiques récents classés par taxon, zone, thématique et pression sur la biodiversité.</p></header>
<div class="layout"><aside class="filters">
<h3>Recherche</h3><input id="q" type="search" placeholder="Titre, auteur, mot-clé…">
<h3>Taxon</h3><select id="taxon"><option value="">Tous</option></select>
<h3>Zone géographique</h3><select id="zone"><option value="">Toutes</option></select>
<h3>Thématique</h3><select id="theme"><option value="">Toutes</option></select>
<h3>Revue</h3><select id="revue"><option value="">Toutes</option></select>
<h3>Année</h3><select id="annee"><option value="">Toutes</option></select>
<h3>Focus biodiversité</h3><div id="focuses"></div>
<button onclick="reset()">Réinitialiser</button></aside>
<main><div class="kpis" id="kpis"></div>
<div class="charts">
<div class="card"><h2>Articles par pression</h2><canvas id="chartPressure"></canvas></div>
<div class="card"><h2>Tendance par année</h2><canvas id="chartYear"></canvas></div>
<div class="card"><h2>Grandes zones</h2><canvas id="chartZone"></canvas></div>
<div class="card"><h2>Taxons</h2><canvas id="chartTaxon"></canvas></div></div>
<h2 style="font-size:16px">Articles filtrés <span id="count"></span></h2>
<div class="results" id="results"></div></main></div>
<script>
let DATA=[];
const colors=['#60a5fa','#4ade80','#fbbf24','#f87171','#c084fc','#38bdf8','#fb923c','#a3e635'];
const uniq=a=>[...new Set(a)].sort((x,y)=>x.localeCompare(y,'fr'));
function fill(id,key){const s=document.getElementById(id);uniq(DATA.flatMap(d=>d[key])).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})}
function init(){fill('taxon','taxon');fill('zone','zone');fill('theme','themes');fill('revue','revue');fill('annee','annee');
uniq(DATA.map(d=>d.focus)).forEach(f=>{const l=document.createElement('label');l.className='chk';l.innerHTML=`<input type="checkbox" value="${f}" onchange="render()"> ${f}`;document.getElementById('focuses').appendChild(l)});render()}
const v=id=>document.getElementById(id).value;
const cf=()=>[...document.querySelectorAll('#focuses input:checked')].map(i=>i.value);
function filtered(){const q=v('q').toLowerCase(),t=v('taxon'),z=v('zone'),th=v('theme'),r=v('revue'),a=v('annee'),fs=cf();
return DATA.filter(d=>(!q||(d.titre+d.auteurs+d.resume+d.revue).toLowerCase().includes(q))&&(!t||d.taxon.includes(t))&&(!z||d.zone.includes(z))&&(!th||d.themes.includes(th))&&(!r||d.revue===r)&&(!a||String(d.annee)===a)&&(!fs.length||fs.includes(d.focus)))}
function countBy(items,key){const m={};items.forEach(d=>(Array.isArray(d[key])?d[key]:[d[key]]).forEach(x=>m[x]=(m[x]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bar(canvas,entries){const c=canvas.getContext('2d');const w=canvas.width=canvas.clientWidth*2,h=canvas.height=460;c.clearRect(0,0,w,h);
const max=Math.max(...entries.map(e=>e[1]),1),pad=14,bw=(w-pad*2)/Math.max(entries.length,1);
entries.forEach((e,i)=>{const bh=(h-70)*e[1]/max,x=pad+i*bw,y=h-45-bh;c.fillStyle=colors[i%colors.length];c.fillRect(x+6,y,bw-12,bh);
c.fillStyle='#9fb0c8';c.font='22px Arial';c.textAlign='center';c.fillText(e[1],x+bw/2,y-8);
c.save();c.translate(x+bw/2,h-18);c.rotate(-.42);c.fillStyle='#e8eef8';c.font='20px Arial';c.textAlign='right';c.fillText(e[0].length>26?e[0].slice(0,25)+'…':e[0],0,0);c.restore()})}
function render(){const f=filtered();document.getElementById('count').textContent=`(${f.length})`;
document.getElementById('kpis').innerHTML=[['Articles',f.length],['Revues',uniq(f.map(d=>d.revue)).length],['Taxons',uniq(f.flatMap(d=>d.taxon)).length],['Zones',uniq(f.flatMap(d=>d.zone)).length]].map(k=>`<div class="kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
bar(document.getElementById('chartPressure'),countBy(f,'pression'));
const y={};f.forEach(d=>y[d.annee]=(y[d.annee]||0)+1);bar(document.getElementById('chartYear'),Object.entries(y).sort());
bar(document.getElementById('chartZone'),countBy(f,'zone').slice(0,8));bar(document.getElementById('chartTaxon'),countBy(f,'taxon').slice(0,8));
document.getElementById('results').innerHTML=f.map(d=>`<article class="article"><h4>${d.titre}</h4><div class="meta">${d.auteurs} · <b>${d.revue}</b> · ${d.annee} · DOI ${d.doi}</div><p class="resume">${d.resume}</p><div class="tags"><span class="tag focus">Focus : ${d.focus}</span><span class="tag pressure">${d.pression}</span>${d.themes.map(t=>`<span class="tag">${t}</span>`).join('')}${d.taxon.map(t=>`<span class="tag">${t}</span>`).join('')}${d.zone.map(t=>`<span class="tag">${t}</span>`).join('')}</div><p><a href="${d.url}" target="_blank" rel="noopener">Ouvrir l’article ↗</a></p></article>`).join('')||'<p style="color:var(--muted)">Aucun article ne correspond aux filtres.</p>'}
function reset(){['q','taxon','zone','theme','revue','annee'].forEach(id=>document.getElementById(id).value='');document.querySelectorAll('#focuses input').forEach(i=>i.checked=false);render()}
['q','taxon','zone','theme','revue','annee'].forEach(id=>document.getElementById(id).addEventListener('input',render));
fetch('data/articles.json').then(r=>r.json()).then(d=>{DATA=d;init()}).catch(()=>alert('Impossible de charger data/articles.json'));
window.addEventListener('resize',render);
</script></body></html>

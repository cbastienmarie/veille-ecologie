<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veille écologie et biodiversité</title>
<style>body{margin:0;background:#0f172a;color:#e8eef8;font:16px system-ui}header,main{padding:24px;max-width:1300px;margin:auto}h1{margin:0}p{line-height:1.5}#filters{display:flex;flex-wrap:wrap;gap:12px}label{display:grid;gap:5px}select,input,button{padding:10px;border-radius:6px;border:1px solid #456;background:#17243b;color:white}#charts,#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}article,section.chart{padding:18px;background:#17243b;border-radius:10px;overflow-wrap:anywhere}h2{font-size:19px}h3{font-size:16px}a{color:#93c5fd}.meta,small{color:#c0cce0}.bar{display:block;background:#38bdf8;height:10px;margin:5px 0 12px;border-radius:4px}#status{padding:12px;border:1px solid #456;white-space:pre-wrap}button{cursor:pointer}</style>
<header><h1>Veille écologie et biodiversité</h1><p>Articles scientifiques par taxon, zone géographique et pression sur la biodiversité.</p><small>Version corrective 2026-11-12-B · Fréquences du corpus, pas tendances de la biodiversité.</small></header>
<main><p id="status" role="status">Chargement des articles…</p><div id="filters"><label>Recherche<input id="q" type="search" placeholder="Titre, auteur, résumé"></label></div><div id="charts"></div><h2>Articles filtrés</h2><div id="results"></div></main>
<script>
'use strict';
let DATA=[];
const fields=[['taxon','Taxon'],['zone','Zone géographique'],['themes','Thématique'],['revue','Revue'],['annee','Année'],['focus','Focus biodiversité']];
const el=id=>document.getElementById(id);
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=x=>Array.isArray(x)?x:(x==null?[]:[x]);
function init(){
 for(const [key,label] of fields){const box=document.createElement('label');box.textContent=label;const s=document.createElement('select');s.id=key;s.add(new Option('Tous',''));const values=[...new Set(DATA.flatMap(d=>list(d[key]).map(String)))];values.sort((a,b)=>key==='annee'?Number(b)-Number(a):a.localeCompare(b,'fr'));for(const v of values)s.add(new Option(v,v));s.onchange=render;box.append(s);el('filters').append(box);}
 el('q').oninput=render;const b=document.createElement('button');b.textContent='Réinitialiser';b.onclick=()=>{el('q').value='';fields.forEach(([k])=>el(k).value='');render();};el('filters').append(b);render();
}
function histogram(data,key,title){
 const counts=new Map();for(const d of data)for(const x of new Set(list(d[key]).map(String)))counts.set(x,(counts.get(x)||0)+1);
 const entries=[...counts].sort((a,b)=>key==='annee'?Number(a[0])-Number(b[0]):b[1]-a[1]);const max=Math.max(1,...entries.map(x=>x[1]));
 return '<section class="chart"><h2>'+escapeHTML(title)+'</h2>'+entries.map(([k,n])=>'<div>'+escapeHTML(k)+' : '+n+'<span class="bar" style="width:'+100*n/max+'%"></span></div>').join('')+(entries.length?'':'Aucune donnée')+'</section>';
}
function render(){
 const q=el('q').value.toLocaleLowerCase('fr');const data=DATA.filter(d=>(!q||[d.titre,d.auteurs,d.resume,d.revue].join(' ').toLocaleLowerCase('fr').includes(q))&&fields.every(([k])=>!el(k).value||list(d[k]).map(String).includes(el(k).value)));
 el('status').textContent=data.length+' article(s) affiché(s) sur '+DATA.length+' · '+new Set(data.map(d=>d.revue)).size+' revue(s).';
 el('charts').innerHTML=histogram(data,'pression','Articles par pression')+histogram(data,'annee','Publications par année')+histogram(data,'zone','Répartition géographique')+histogram(data,'taxon','Répartition par taxon');
 el('results').innerHTML=data.map(d=>{const raw=d.url||(d.doi?'https://doi.org/'+d.doi:'');let url='';try{const u=new URL(raw);if(['https:','http:'].includes(u.protocol))url=u.href;}catch{}return '<article><h3>'+escapeHTML(d.titre)+'</h3><p class="meta">'+escapeHTML(d.auteurs)+' · '+escapeHTML(d.revue)+' · '+escapeHTML(d.annee)+'</p><p>'+escapeHTML(d.resume||'Résumé non renseigné.')+'</p><p><small>'+escapeHTML([...list(d.focus),...list(d.themes),...list(d.taxon),...list(d.zone)].join(' · '))+'</small></p>'+(url?'<a href="'+escapeHTML(url)+'" target="_blank" rel="noopener noreferrer">Ouvrir la source</a>':'')+'</article>';}).join('')||'<p>Aucun article ne correspond aux filtres.</p>';
}
async function load(){
 const errors=[];for(const path of ['./articles.json','./data/articles.json']){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data))throw new Error('Le JSON doit être une liste');DATA=data;break;}catch(e){errors.push(path+' : '+e.message);}}
 if(errors.length===2){el('status').textContent='Échec du chargement des données :\n'+errors.join('\n');return;}
 try{init();}catch(e){console.error(e);el('status').textContent='Données chargées, mais erreur d’affichage : '+e.message;}
}
load();
</script></html>
